<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fccf00">
<title>「あたり前」Jumper診断</title>
<link rel="preload" as="image" href="svgs/app_top.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app-frame">

  <!-- TOP -->
  <section id="screen-top" class="screen active">
    <div class="stage">
      <img id="top-base" class="stage-base" alt="">
      <video id="top-hero" class="top-hero" muted playsinline autoplay loop preload="auto"
             disablepictureinpicture disableremoteplayback aria-hidden="true"></video>
      <button id="start-button" class="hotspot"><img alt=""></button>
      <p id="diagnosis-count" class="diagnosis-count" hidden></p>
    </div>
  </section>

  <!-- QUESTION（Q1〜Q4を共通描画） -->
  <section id="screen-question" class="screen">
    <div class="stage">
      <img id="question-base" class="stage-base" alt="">
      <div id="question-choices"></div>
      <button id="back-button" class="hotspot hotspot--pad"><img alt=""></button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="screen-result" class="screen">
    <div class="stage">
      <img id="result-base" class="stage-base" alt="">
      <div id="result-others"></div>
      <a id="note-link" class="hotspot" href="#" target="_blank" rel="noopener"><img alt=""></a>
    </div>
  </section>

</main>

<!-- 他タイプ表示用モーダル -->
<div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" hidden>
  <div class="modal-sheet">
    <div class="stage">
      <img id="modal-base" class="stage-base" alt="">
      <button id="modal-close" class="hotspot hotspot--pad"><img alt=""></button>
    </div>
  </div>
</div>

<script src="content.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
